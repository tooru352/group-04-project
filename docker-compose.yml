version: '3.9'

services:
  api:
    build: .
    container_name: lms-api
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: lms-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    depends_on:
      - api
